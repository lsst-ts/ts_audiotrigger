{% set data= load_setup_py_data() %}
package:
  name: ts-audiotrigger
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    - run_audiotrigger = lsst.ts.audiotrigger:execute_runner

test:
  requires:
    - ts-conda-build =0.5

  source_files:
    - python
    - tests
    - setup.py
    - pyproject.toml
  commands:
    - run_audiotrigger -h
    - pytest

requirements:
  host:
    - python {{ python }}
    - pip
    - wheel
    - setuptools_scm ={{ setuptools_scm }}
    - setuptools >={{ setuptools }}
  run:
    - python {{ python }}
    - numpy
    - scipy =1.11
    - pigpio =1.78
    - python-sounddevice =0.5
    - ts-tcpip =2
    - pyserial =3
    - ts-utils =1
    - jsonschema =4.20
    - ts-ess-controller
    - ts-ess-common
